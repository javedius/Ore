# Continuous integration: type-check the frontend and run Rust tests
# on every push to main and every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Linux dependencies (webkit2gtk for tauri codegen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      # tsc runs first here; it also produces dist/ which the tauri
      # build script expects at compile time.
      - name: Type-check and build frontend
        run: npm run build
        working-directory: app

      - name: Rust tests
        run: cargo test --workspace
        working-directory: app/src-tauri
