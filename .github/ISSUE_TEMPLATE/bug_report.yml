name: Bug report
description: Something works wrong or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **never attach private database files** —
        describe the relevant schema (table names, column types) instead.
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.1 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ore version or commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message / console output
      placeholder: Paste any error text here
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach private database files
          required: true
